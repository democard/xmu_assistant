[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmu-assistant"
dynamic = ["version"]
description = "xmu助手 for XMU TronClass rollcall monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.31.0",
    "xmulogin>=1.0.0",
    "PySide6>=6.7.0",
    # DPAPI 凭据加密（A1）：仅 Windows；缺失时 secrets.protect 显式告警并回退明文
    "pywin32>=306; sys_platform == \"win32\"",
]

[project.scripts]
xmu-dashboard = "xmu_rollcall.desktop_qt.app:main"

[tool.setuptools.packages.find]
# 必须自动发现并包含子包：此前 packages = ["xmu_rollcall"] 漏掉 desktop_qt 子包，
# pip install 产出的 wheel 不含全部 UI 文件，入口点 xmu-dashboard 直接
# ModuleNotFoundError（开发一直走 PYTHONPATH 从未暴露）。
include = ["xmu_rollcall*"]

[tool.setuptools.package-data]
# The wheel must retain the icon fallback used when the repository-level
# assets directory is absent after installation.
xmu_rollcall = ["assets/*.ico", "assets/*.png"]

[tool.setuptools.dynamic]
version = {attr = "xmu_rollcall.__version__"}
